[package]
name = "quadra"
description = "Quadra: a native, GPU-rendered UI framework. The crate apps depend on"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
quadra-app = { path = "../quadra-app" }
quadra-async = { path = "../quadra-async" }
quadra-layout = { path = "../quadra-layout" }
quadra-platform = { path = "../quadra-platform" }
quadra-prim = { path = "../quadra-prim" }
quadra-reactive = { path = "../quadra-reactive" }
quadra-tree = { path = "../quadra-tree" }
quadra-view = { path = "../quadra-view" }

# The native crate of the operating system (specs/10, "The native crate").
[target.'cfg(windows)'.dependencies]
quadra-native-win = { path = "../quadra-native-win" }

[target.'cfg(target_os = "macos")'.dependencies]
quadra-native-mac = { path = "../quadra-native-mac" }

# No native crate there (specs/23): the facade still names an app's type, on no GPU.
[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
quadra-render = { path = "../quadra-render" }
