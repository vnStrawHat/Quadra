[package]
name = "quadra-shell"
description = "Quadra's services of the OS beyond windows: dialogs, opening, the tray, one instance, crash reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The other crate that may hold unsafe code (specs/01, R16): it does not inherit the
# workspace lints, which forbid it.

[dependencies]
# The pseudo console (`pty`): the terminal engine's, polled with its poller (specs/01, R15).
oneterm-vt = { git = "https://github.com/vnStrawHat/oneterm-vt", tag = "v0.2.0", default-features = false, features = ["pty"] }
polling = "3"
quadra-app = { path = "../quadra-app" }
quadra-async = { path = "../quadra-async" }
quadra-reactive = { path = "../quadra-reactive" }
quadra-render = { path = "../quadra-render" }

# What only Windows builds: the `win` module.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
quadra-platform = { path = "../quadra-platform" }
quadra-text = { path = "../quadra-text" }
quadra-view = { path = "../quadra-view" }

# Explicitly not inheriting the workspace lints (see above).
[lints]
