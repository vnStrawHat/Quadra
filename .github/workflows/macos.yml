# Quadra on macOS (specs/23): what is built for it so far is linted and tested on a Mac, on a
# push to main or to the branch of the port and on a pull request. The Windows gate
# (tools/check.sh) is run by a developer, not here.
name: macOS

on:
  push:
    branches: [main, macos]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

# One run per ref: a newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lints and tests on a Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the pinned toolchain
        id: toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          [ -n "$channel" ] || { echo "::error::rust-toolchain.toml has no channel"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-23
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 tag, 2026-07-23

      - name: Lints and tests
        run: |
          set -o pipefail
          bash tools/check_mac.sh 2>&1 | tee check_mac.log

      # The gallery's pages drawn by Metal and Core Text, without a window (specs/23, M2):
      # every page must draw. The pictures are kept with the run, for who looks at them.
      - name: The gallery's pages as pictures
        run: |
          set -o pipefail
          echo "== the gallery's pages" | tee -a check_mac.log
          bash tools/shots.sh dark 2>&1 | tee -a check_mac.log

      # An app as a bundle (specs/23, "The app bundle"), with the binary of the profile the
      # tests built: the bundle's making is what is tried here, not the shipped build.
      - name: Markdown as a bundle
        run: |
          set -o pipefail
          echo "== the bundle" | tee -a check_mac.log
          PACKAGE_PROFILE=dev bash tools/package_mac.sh markdown 2>&1 | tee -a check_mac.log

      # The bundle made the app that opens its files (specs/16, "On macOS"): asked of Launch
      # Services for the runner's user, which nothing but this job uses.
      - name: Markdown made the app of its files
        run: |
          set -o pipefail
          echo "== the app of .md files" | tee -a check_mac.log
          QUADRA_BUNDLE="$PWD/target/package/Markdown.app" bash tools/cargo.sh test -p quadra-shell --test assoc_mac 2>&1 | tee -a check_mac.log

      # Asked of the runner's macOS once (specs/16, "On macOS"): what makes an app the default
      # for a kind of file there, and when. It fails no job, and goes when it has answered.
      - name: What makes an app the default, asked of the system
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/assoc.swift" <<'SWIFT'
          import AppKit
          import UniformTypeIdentifiers
          let app = URL(fileURLWithPath: CommandLine.arguments[1])
          let kind = UTType(filenameExtension: "md")!
          let ws = NSWorkspace.shared
          func now() -> String { ws.urlForApplication(toOpen: kind)?.path ?? "none" }
          print("assoc: the kind of .md is \(kind.identifier); its app is \(now())")
          let done = DispatchSemaphore(value: 0)
          ws.setDefaultApplication(at: app, toOpen: kind) { error in
              print("assoc: the workspace said \(String(describing: error))")
              done.signal()
          }
          print("assoc: at once its app is \(now())")
          print("assoc: the wait for the workspace: \(done.wait(timeout: .now() + 20))")
          print("assoc: then its app is \(now())")
          SWIFT
          swift "$RUNNER_TEMP/assoc.swift" "$PWD/target/package/Markdown.app" 2>&1 | tee -a check_mac.log

      # The bundle in a real window, as the runner's screen shows it (specs/23, "What a real
      # Mac is asked"): a try that fails no job, as a runner may show or capture nothing.
      - name: Markdown in a real window
        continue-on-error: true
        run: |
          set -o pipefail
          echo "== a real window" | tee -a check_mac.log
          bash tools/window_mac.sh 2>&1 | tee -a check_mac.log

      # Markdown's screens the same way (specs/23, M3): the app as it is on a Mac.
      - name: Markdown's screens as pictures
        run: |
          set -o pipefail
          echo "== Markdown's screens" | tee -a check_mac.log
          bash tools/cargo.sh run -q -p quadra-bench-markdown-shots -- .tmp/shots/markdown 2>&1 | tee -a check_mac.log

      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gallery-dark-macos
          path: |
            .tmp/shots/dark
            .tmp/shots/markdown
            .tmp/shots/window
          if-no-files-found: ignore
          retention-days: 14

      # What ran, as a notice of the run: the tests that passed, the native crate's own, and
      # how many pictures of the gallery were drawn.
      - name: Say what passed
        if: always()
        run: |
          pictures=$(find .tmp/shots/dark -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
          passed=$(awk '/^test result: ok/ { for (i = 1; i <= NF; i++) if ($i == "passed;") sum += $(i - 1) } END { print sum + 0 }' check_mac.log)
          native=$(awk '/^== quadra-native-mac/ { on = 1 } /^== the rest/ { on = 0 } /^== the gallery/ { on = 0 }
            on && /Running/ { name = $2 } on && /^test result/ { printf "%s: %s passed, %s failed. ", name, $4, $6 }' check_mac.log)
          echo "::notice title=Tests on a Mac::$passed passed. quadra-native-mac: ${native:-not run} The gallery: $pictures pictures."

      # The end of what failed, as an annotation of the run: read on the run's page, and by
      # who has no right to its log.
      - name: Say what failed
        if: failure()
        run: |
          grep -vE '^ *(Compiling|Checking|Downloading|Downloaded|Running|Finished|Fresh|Doc-tests) |^$' check_mac.log |
            grep -vE '^test .* (ok|ignored)$|^running [0-9]+ tests?$|^test result: ok' |
            tail -n 200 | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 } END { print "" }' > said.txt
          echo "::error title=tools/check_mac.sh::$(cat said.txt)"
