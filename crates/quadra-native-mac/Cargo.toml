[package]
name = "quadra-native-mac"
description = "Quadra on macOS: the Core Text text backend; the Metal renderer and the AppKit platform are to come"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# One of the crates that may hold unsafe code (specs/01, R16): it does not inherit the
# workspace lints, which forbid it.

# What only macOS builds: all of the crate (specs/23).
[target.'cfg(target_os = "macos")'.dependencies]
quadra-text = { path = "../quadra-text" }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFAttributedString",
    "CFBase",
    "CFCGTypes",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGFont",
    "CGImage",
] }
objc2-core-text = { version = "0.3.2", default-features = false, features = [
    "std",
    "CTFont",
    "CTFontDescriptor",
    "CTFontManager",
    "CTFontTraits",
    "CTLine",
    "CTRun",
    "CTStringAttributes",
    "objc2-core-graphics",
] }

# Explicitly not inheriting the workspace lints (see above).
[lints]
