[package]
name = "oneterm"
description = "1Term: a terminal app of local shells, in tabs and spaces side by side (specs/19)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "1term"
path = "src/main.rs"

[dependencies]
quadra = { path = "../../crates/quadra" }
quadra-code = { path = "../../crates/quadra-code" }
# Argon2id alone, with no password-hash strings: the vault calls the function itself.
argon2 = { version = "0.6", default-features = false, features = ["zeroize"] }
quadra-data = { path = "../../crates/quadra-data" }
quadra-design = { path = "../../crates/quadra-design" }
oneterm-complete = { path = "complete" }
oneterm-ssh = { path = "ssh" }
quadra-shell = { path = "../../crates/quadra-shell" }
quadra-term = { path = "../../crates/quadra-term", features = ["pty"] }
quadra-tree = { path = "../../crates/quadra-tree" }

[dev-dependencies]
oneterm-ssh = { path = "ssh", features = ["testing"] }
quadra-render = { path = "../../crates/quadra-render" }
quadra-testing = { path = "../../crates/quadra-testing" }
quadra-tree = { path = "../../crates/quadra-tree" }
