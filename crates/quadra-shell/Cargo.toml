[package]
name = "quadra-shell"
description = "Quadra's services of the OS beyond windows: dialogs, opening, the tray, one instance, crash reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The other crate that may hold unsafe code (specs/01, R16): it does not inherit the
# workspace lints, which forbid it.

[dependencies]
quadra-app = { path = "../quadra-app" }
quadra-async = { path = "../quadra-async" }
quadra-reactive = { path = "../quadra-reactive" }
quadra-render = { path = "../quadra-render" }
# Secrets wiped from memory when dropped (specs/01, R15).
zeroize = { version = "1", default-features = false, features = ["alloc"] }

# What only Windows builds: the `win` module.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# What only macOS builds: the `mac` module (specs/23, M3).
[target.'cfg(target_os = "macos")'.dependencies]
# What the system asks the app to open (`mac/instance.rs`).
quadra-native-mac = { path = "../quadra-native-mac" }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSDictionary",
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSAlert",
    "NSApplication",
    "NSBitmapImageRep",
    "NSButton",
    "NSControl",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSSavePanel",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
] }

[dev-dependencies]
quadra-platform = { path = "../quadra-platform" }
quadra-text = { path = "../quadra-text" }
quadra-view = { path = "../quadra-view" }

# On the main thread, as an application's code is (the item in the menu bar).
[[test]]
name = "tray_mac"
harness = false

# Explicitly not inheriting the workspace lints (see above).
[lints]
