[package]
name = "quadra-bench-compare"
description = "The comparison bench's four scenes (docs/benchmarks.md), measured from outside by its runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "compare"
path = "src/main.rs"

[dependencies]
quadra = { path = "../../crates/quadra" }
# For the headless mode (BENCH_HEADLESS): the app on other backends than the facade's.
quadra-app = { path = "../../crates/quadra-app" }
quadra-native-win = { path = "../../crates/quadra-native-win" }
quadra-platform = { path = "../../crates/quadra-platform" }
quadra-render = { path = "../../crates/quadra-render" }
