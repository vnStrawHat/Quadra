[package]
name = "quadra-native-win"
description = "Quadra on Windows: the D3D11 renderer, the DirectWrite text backend, the Win32 platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# One of the two crates that may hold unsafe code (specs/01, R16): it does not inherit the
# workspace lints, which forbid it.

[dependencies]
accesskit = "0.25"
accesskit_windows = "0.35"
quadra-a11y = { path = "../quadra-a11y", features = ["accesskit"] }
quadra-platform = { path = "../quadra-platform" }
quadra-prim = { path = "../quadra-prim" }
quadra-render = { path = "../quadra-render" }
quadra-text = { path = "../quadra-text" }
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Time",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# A test reads a window back through UI Automation, as a screen reader does (specs/12).
windows = { version = "0.62", features = [
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
] }
quadra-layout = { path = "../quadra-layout" }
quadra-reactive = { path = "../quadra-reactive" }
quadra-text = { path = "../quadra-text" }
quadra-tree = { path = "../quadra-tree" }
quadra-view = { path = "../quadra-view" }

# Explicitly not inheriting the workspace lints (see above).
[lints]
