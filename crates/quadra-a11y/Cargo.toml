[package]
name = "quadra-a11y"
description = "Quadra's semantic tree: what a node means to a user, for assistive technology and for tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The tree as `accesskit` takes it (`bridge`): for the native crates (specs/01, R11).
accesskit = ["dep:accesskit"]

[dependencies]
quadra-prim = { path = "../quadra-prim" }
accesskit = { version = "0.25", optional = true }
