[package]
name = "quadra-bench-doomfire"
description = "A terminal's throughput measured by a fire demo written again (specs/14, Terminal throughput)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "doomfire"
path = "src/main.rs"

[[bin]]
name = "doomfire-feed"
path = "src/feed.rs"

[[bin]]
name = "doomfire-conpty"
path = "src/conpty.rs"

[dependencies]
quadra-shell = { path = "../../crates/quadra-shell" }
quadra-term = { path = "../../crates/quadra-term", features = ["pty"] }
