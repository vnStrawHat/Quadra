[workspace]
resolver = "3"
members = ["crates/*", "bench/*", "examples/*", "apps/markdown", "apps/oneterm/crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

# What OneTerm's crates name with `workspace = true` (specs/19, "The repository"): their
# manifests read the same here and in a repository of the app's own, whose root manifest
# (apps/oneterm/Cargo.root.toml) names the same crates of Quadra by its git address.
[workspace.dependencies]
quadra = { path = "crates/quadra" }
quadra-app = { path = "crates/quadra-app" }
quadra-async = { path = "crates/quadra-async" }
quadra-build = { path = "crates/quadra-build" }
quadra-code = { path = "crates/quadra-code" }
quadra-data = { path = "crates/quadra-data" }
quadra-design = { path = "crates/quadra-design" }
quadra-native-win = { path = "crates/quadra-native-win" }
quadra-platform = { path = "crates/quadra-platform" }
quadra-prim = { path = "crates/quadra-prim" }
quadra-render = { path = "crates/quadra-render" }
quadra-shell = { path = "crates/quadra-shell" }
quadra-term = { path = "crates/quadra-term" }
quadra-testing = { path = "crates/quadra-testing" }
quadra-tree = { path = "crates/quadra-tree" }
quadra-updater = { path = "crates/quadra-updater" }
oneterm-app = { path = "apps/oneterm/crates/app" }
oneterm-completion = { path = "apps/oneterm/crates/completion" }
oneterm-ssh = { path = "apps/oneterm/crates/ssh" }
oneterm-vault = { path = "apps/oneterm/crates/vault" }

# specs/01, R16: every crate inherits this except the two that hold OS code.
[workspace.lints.rust]
unsafe_code = "forbid"

# Less debug info: smaller build output on a machine with little disk (specs/00). Release
# settings are fixed with measurements in phase R1.
[profile.dev]
debug = "line-tables-only"

# A vault's key takes 64 MiB and three passes of Argon2id (specs/19, "Saved passwords"):
# seconds unoptimized, so a debug build and its tests optimize these two.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# What ships and what is measured (specs/14, "Shipped builds"): release, with the whole program
# optimized at once. The gate builds and tests in plain release, which builds far faster.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
