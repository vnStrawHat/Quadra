[package]
name = "quadra-bench-shots"
description = "Draws the pages of the gallery without a window, to pictures: for design review and comparison"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "shots"
path = "src/main.rs"

[dependencies]
quadra-app = { path = "../../crates/quadra-app" }
quadra-async = { path = "../../crates/quadra-async" }
quadra-gallery = { path = "../../examples/gallery" }
quadra-design = { path = "../../crates/quadra-design" }
quadra-platform = { path = "../../crates/quadra-platform" }
quadra-prim = { path = "../../crates/quadra-prim" }
quadra-render = { path = "../../crates/quadra-render" }

# The renderer, the text and the image codecs of the system the pictures are drawn on.
[target.'cfg(windows)'.dependencies]
quadra-native-win = { path = "../../crates/quadra-native-win" }

[target.'cfg(target_os = "macos")'.dependencies]
quadra-native-mac = { path = "../../crates/quadra-native-mac" }
